name: Post Deploy Smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Deployment URL to test (for manual runs)
        required: true
        type: string

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve deployment URL
        id: resolve_url
        env:
          MANUAL_URL: ${{ inputs.url }}
          STATUS_URL: ${{ github.event.deployment_status.target_url }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          url="${MANUAL_URL:-${STATUS_URL:-$DEPLOYMENT_URL}}"
          if [[ -z "$url" ]]; then
            echo "No deployment URL available in event payload."
            exit 1
          fi
          echo "target_url=$url" >> "$GITHUB_OUTPUT"
          echo "Using deployment URL: $url"

      - name: Run smoke checks
        env:
          TARGET_URL: ${{ steps.resolve_url.outputs.target_url }}
        run: npm run test:smoke:deploy
