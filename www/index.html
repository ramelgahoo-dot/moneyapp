<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0">
  <title>MoneyApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #eef6ff 0%, #e5f0ff 47%, #ebf5ff 100%);
      color: #17335f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .card {
      max-width: 320px;
      padding: 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 60px rgba(23, 51, 95, 0.12);
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(47, 128, 255, 0.2);
      border-top-color: #2f80ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.4; color: #5c7090; margin-bottom: 8px; }
    .status { font-size: 12px; color: #2f80ff; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>MoneyApp</h1>
    <p>Starting the app…</p>
    <div class="status" id="status">Preparing local shell</div>
  </div>
  <script>
    const status = document.getElementById('status');
    const targetUrl = 'https://moneyapp-snowy.vercel.app/';
    const tryRemote = () => {
      if (status) status.textContent = 'Loading remote app';
      window.location.replace(targetUrl);
    };

    window.addEventListener('load', () => {
      if (status) status.textContent = 'Ready';
      setTimeout(tryRemote, 350);
    });
  </script>
</body>
</html>
